<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二蛋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; font-family: -apple-system, "PingFang SC", sans-serif; }

  /* ---------- 小龙 ---------- */
  #dragon-wrap { position: absolute; z-index: 2; transition: filter .3s ease, left .28s ease, right .28s ease, bottom .28s ease, top .28s ease, width .28s ease, height .28s ease, transform .3s ease; }
  #dragon-wrap svg { width: 100%; height: 100%; overflow: visible; }
  /* 待机:底部居中,大(左右朝向由内部镜像处理) */
  body:not(.chat) #dragon-wrap { left: 50%; bottom: 4px; width: 132px; height: 132px; transform: translateX(-50%); }
  /* 对话:缩到卡片左上角当头像 */
  body.chat #dragon-wrap { left: 12px; top: 8px; width: 46px; height: 46px; }

  #hit { position: absolute; left: 50%; bottom: 4px; width: 112px; height: 130px; transform: translateX(-50%); z-index: 3; cursor: pointer; }
  /* 巡逻时宠物会绕到任意边,点击热区铺满整个窗口,随处点它都能开聊天 */
  body:not(.chat) #hit { left: 0; bottom: 0; width: 100%; height: 100%; transform: none; }
  body.chat #hit { display: none; }

  /* ---------- 待机气泡 ---------- */
  #bubble { position: absolute; left: 50%; bottom: 180px; transform: translateX(-50%) translateY(8px) scale(.92);
    max-width: 154px; min-width: 50px; z-index: 4; background: #fffdf7; border: 2px solid #f2994c; border-radius: 14px;
    padding: 8px 11px; font-size: 12px; line-height: 1.5; color: #4a3428; box-shadow: 0 4px 12px rgba(0,0,0,.14);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1); }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
  #bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #f2994c; border-bottom: 0; }
  #bubble .actions { margin-top: 7px; display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
  #bubble .actions button { border: 1.5px solid #f2994c; background: #fff; color: #9a5a1a; border-radius: 9px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  #bubble .actions button.primary { background: #f2994c; color: #fff; }
  body.chat #bubble { display: none; }

  /* ---------- 对话卡片 ---------- */
  #card { position: absolute; inset: 6px; z-index: 1; background: #fffdf7; border: 2.5px solid #f2994c; border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.22); display: none; flex-direction: column; overflow: hidden; }
  body.chat #card { display: flex; }
  #card-head { height: 46px; flex: 0 0 auto; display: flex; align-items: center; padding: 0 8px 0 66px; border-bottom: 1.5px solid #f5e2c4; }
  #card-head .name { font-size: 13px; font-weight: 600; color: #9a5a1a; flex: 1; }
  #card-head button { width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer; font-size: 12px; margin-left: 4px;
    background: #fdeed9; color: #9a5a1a; }
  #card-head button:hover { background: #f7d9a8; }

  #messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
  .msg { max-width: 84%; padding: 7px 10px; border-radius: 12px; font-size: 12.5px; line-height: 1.5; word-break: break-word; }
  .msg.me { align-self: flex-end; background: #f2994c; color: #fff; border-bottom-right-radius: 4px; }
  .msg.pet { align-self: flex-start; background: #f3ede2; color: #4a3428; border-bottom-left-radius: 4px; }
  .msg.pet.typing::after { content: "·"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"·"} 50%{content:"··"} 75%{content:"···"} }
  /* Markdown 渲染(宠物回复 / 气泡) */
  .md > div + div { margin-top: 3px; }
  .md ul, .md ol { margin: 3px 0; padding-left: 18px; }
  .md li { margin: 1px 0; }
  .md .mdh { font-weight: 700; margin: 4px 0 1px; }
  .md code { background: rgba(0,0,0,.08); padding: 0 3px; border-radius: 4px; font-size: .92em; }
  .md a { color: inherit; text-decoration: underline; }
  .msg.me .md code { background: rgba(255,255,255,.25); }

  #inputrow { flex: 0 0 auto; display: flex; gap: 6px; padding: 8px; border-top: 1.5px solid #f5e2c4; }
  #chatinput { flex: 1; min-width: 0; border: 2px solid #eda56b; border-radius: 13px; padding: 7px 11px; font-size: 13px; outline: none;
    background: #fff; color: #4a3428; -webkit-user-select: text; user-select: text; }
  #chatinput:focus { border-color: #f2b93b; }
  #sendbtn { flex: 0 0 auto; border: none; background: #f2994c; border-radius: 13px; width: 42px; cursor: pointer; font-size: 15px; color: #fff; }
  #sendbtn:disabled { opacity: .5; }
  #attachbtn { flex: 0 0 auto; border: 1.5px solid #eda56b; background: #fff; border-radius: 13px; width: 34px; cursor: pointer; font-size: 15px; }
  #attachchip { display: none; align-items: center; gap: 6px; margin: 6px 8px 0; padding: 4px 9px; background: #fdeed9; border-radius: 9px; font-size: 11px; color: #9a5a1a; }
  #attachchip.show { display: flex; }
  #attachchip .x { margin-left: auto; cursor: pointer; font-weight: bold; padding: 0 3px; }

  /* ---------- 设置面板(覆盖在卡片内) ---------- */
  #settings { position: absolute; inset: 46px 0 0 0; background: #fffdf7; z-index: 5; display: none; padding: 10px; overflow-y: auto; font-size: 11px; color: #4a3428; }
  #settings.show { display: block; }
  #settings h4 { font-size: 12px; margin-bottom: 6px; }
  #themes { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 2px 0 14px; }
  #themes .sw { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 1px 3px rgba(0,0,0,.2); position: relative; }
  #themes .sw.active { border-color: #4a3428; }
  #themes .sw span { position: absolute; bottom: -13px; left: 50%; transform: translateX(-50%); font-size: 8px; white-space: nowrap; color: #7a6248; }
  #custom-color { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; }
  #custom-color input[type=color] { width: 40px; height: 28px; margin: 0; padding: 0; border: 1.5px solid #eda56b; border-radius: 8px; background: #fff; cursor: pointer; }
  #custom-color input[type=color].active { border-color: #4a3428; border-width: 2px; }
  #custom-color span { font-size: 10px; color: #a08560; }
  #parts { margin: 2px 0 14px; }
  .part-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .part-opt { width: 52px; cursor: pointer; border: 2px solid transparent; border-radius: 9px; padding: 3px 3px 1px; text-align: center; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .part-opt.active { border-color: #4a3428; }
  .part-opt svg { width: 44px; height: 24px; display: block; margin: 0 auto; }
  .part-opt span { font-size: 8px; color: #7a6248; }
  #model-list { margin-bottom: 4px; }
  .model-item { display: flex; align-items: center; gap: 5px; padding: 4px 5px; border-radius: 7px; }
  .model-item.active { background: #fdeed9; }
  .model-item .name { flex: 1; }
  .model-item button { border: none; background: none; cursor: pointer; font-size: 12px; }
  #settings input, #settings select { width: 100%; margin: 3px 0; padding: 5px 8px; border: 1.5px solid #eda56b; border-radius: 8px; font-size: 11px; background: #fff; outline: none; -webkit-user-select: text; user-select: text; }
  #settings .row2 { display: flex; gap: 6px; }
  #settings .btns { display: flex; gap: 6px; margin-top: 8px; justify-content: space-between; align-items: center; }
  #settings .btns .right { display: flex; gap: 6px; }
  #settings .btns button { border: 1.5px solid #f2994c; background: #fff; color: #9a5a1a; border-radius: 9px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  #settings .btns button.primary { background: #f2994c; color: #fff; }
  #settings .btns button.danger { border-color: #d66; color: #c44; }
  .hint { color: #a08560; margin: 4px 0; line-height: 1.5; }
  #settings .toggle-row { display: flex; align-items: center; gap: 7px; margin: 2px 0 14px; font-size: 11px; color: #4a3428; cursor: pointer; }
  #settings .toggle-row input { width: auto; margin: 0; cursor: pointer; }
</style>
</head>
<body>
  <div id="dragon-wrap"></div>
  <div id="hit"></div>
  <div id="bubble"></div>

  <div id="card">
    <div id="card-head">
      <div class="name">小龙</div>
      <button id="btn-sleep" title="睡觉/叫醒">🌙</button>
      <button id="btn-settings" title="设置">⚙️</button>
      <button id="btn-close" title="收起">✕</button>
    </div>
    <div id="messages"></div>
    <div id="attachchip"></div>
    <div id="inputrow">
      <button id="attachbtn" title="添加文件/图片(也可直接把文件拖到二蛋身上)">📎</button>
      <input id="chatinput" placeholder="跟二蛋说点什么…" maxlength="500">
      <button id="sendbtn">➤</button>
    </div>
    <div id="settings">
      <h4>🐣 名字</h4>
      <input id="petname-input" placeholder="给它起个名…">
      <h4>🎨 宠物主题</h4>
      <div id="themes"></div>
      <div id="custom-color">
        <input type="color" id="c-color" value="#EE5044" title="自定义颜色">
        <span>或自定义:点左边色块任选颜色</span>
      </div>
      <h4>🐲 部件 · 角</h4>
      <div id="parts"></div>
      <h4>🚶 走动</h4>
      <label class="toggle-row"><input type="checkbox" id="still-toggle"> 静止不动(待在原地,不到处走)</label>
      <h4>🧠 模型配置</h4>
      <div id="model-list"></div>
      <div class="hint">聊天走当前选中的模型;没配也能用,消息会先记到收件箱。</div>
      <input id="m-name" placeholder="名称(如 我的模型)">
      <div class="row2">
        <select id="m-format"><option value="openai">OpenAI 格式</option><option value="anthropic">Anthropic 格式</option></select>
        <input id="m-model" placeholder="模型ID">
      </div>
      <input id="m-url" placeholder="接口地址(如 https://.../v1)">
      <input id="m-key" placeholder="API Key" type="password">
      <div class="btns">
        <button id="btn-quit" class="danger" title="退出二蛋">退出</button>
        <div class="right">
          <button id="m-back">返回</button>
          <button id="m-save" class="primary">保存模型</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 原生由 Swift 注入 dragon.svg + engine.js;浏览器预览走 fetch。
    if (!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet)) {
      fetch('dragon.svg?v=7').then(r => r.text()).then(svg => {
        document.getElementById('dragon-wrap').innerHTML = svg;
        const s = document.createElement('script'); s.src = 'engine.js?v=7'; document.body.appendChild(s);
      }).catch(() => { document.getElementById('dragon-wrap').innerHTML = '<div style="font-size:110px;text-align:center">🐉</div>'; });
    }
  </script>
  <script>
  (() => {
    const $ = id => document.getElementById(id);
    const body = document.body, bubble = $('bubble'), hit = $('hit');
    const card = $('card'), messages = $('messages'), input = $('chatinput'), sendbtn = $('sendbtn'), settings = $('settings');
    const inNative = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet);
    const DEMO = new URLSearchParams(location.search).get('demo') === '1';
    const D = () => window.PetDragon;
    let sleeping = false, busy = false, bubbleTimer = null, pendingTasks = [], config = { models: [], active: null };

    /* ---------- 主题 ---------- */
    const THEMES = [
      { id: 'origin', name: '赤金龙', swatch: '#EE5044', filter: 'none' },
      { id: 'jade', name: '苍翠龙', swatch: '#3FBF6F', filter: 'hue-rotate(105deg) saturate(1.15)' },
      { id: 'azure', name: '玄水龙', swatch: '#37A0D8', filter: 'hue-rotate(165deg) saturate(1.2)' },
      { id: 'violet', name: '紫霄龙', swatch: '#9A6DE0', filter: 'hue-rotate(225deg) saturate(1.1)' },
      { id: 'ink', name: '暗夜龙', swatch: '#5A6270', filter: 'hue-rotate(200deg) saturate(.55) brightness(.82)' },
      { id: 'sakura', name: '樱粉龙', swatch: '#FF9EC2', filter: 'hue-rotate(300deg) saturate(1.05) brightness(1.05)' },
    ];
    let curTheme = 'origin';

    /* ---------- 可切换部件:角(以后可加耳朵/尾巴等,结构相同) ----------
       每款角只画「左边一只」,右边用镜像自动生成,保证对称。base 在头顶 y≈90,向上伸。*/
    const HORN_STYLES = [
      { id: 'pointed', name: '尖角', svg: '<path d="M140 92 C128 66 116 40 120 14 C133 33 153 62 166 90 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.5" stroke-linejoin="round"/><ellipse cx="128" cy="42" rx="4" ry="11" fill="#FFF3C4" opacity="0.85" transform="rotate(-20 128 42)"/>' },
      { id: 'antler', name: '鹿角', svg: '<path d="M144 92 C136 66 132 44 138 14 C146 34 156 64 166 90 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.4" stroke-linejoin="round"/><path d="M138 56 C124 52 112 40 106 24 C120 30 132 42 144 52 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.4" stroke-linejoin="round"/>' },
      { id: 'flame', name: '火焰角', svg: '<path d="M146 92 C132 72 142 58 132 48 C144 48 142 34 134 26 C148 28 148 12 152 4 C158 22 162 44 158 62 C166 76 166 85 166 90 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.2" stroke-linejoin="round"/>' },
      { id: 'forked', name: '分叉角', svg: '<path d="M146 92 C140 70 136 56 136 46 C130 32 122 22 116 12 C127 16 136 28 142 40 C143 30 145 22 149 14 C153 26 153 38 153 48 C159 64 162 78 164 90 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.2" stroke-linejoin="round"/>' },
      { id: 'curved', name: '弯角', svg: '<path d="M150 92 C120 84 104 62 108 40 C110 26 122 18 134 22 C124 30 122 44 132 54 C144 66 160 74 166 90 Z" fill="url(#gGold)" stroke="#DD9A28" stroke-width="3.4" stroke-linejoin="round"/>' },
    ];
    let curHorn = 'pointed';
    function applyHorns(id) {
      const g = document.getElementById('horns'); if (!g) return;
      const s = (HORN_STYLES.find(x => x.id === id) || HORN_STYLES[0]);
      curHorn = s.id;
      g.innerHTML = s.svg + '<g transform="translate(400,0) scale(-1,1)">' + s.svg + '</g>';
      renderParts();
    }
    function applyParts(parts) { if (parts && parts.horns) applyHorns(parts.horns); }
    function setPetName(n) {
      const el = document.querySelector('#card-head .name'); if (el) el.textContent = n || '小龙';
      const inp = document.getElementById('petname-input'); if (inp && document.activeElement !== inp) inp.value = n || '';
    }
    function renderParts() {
      const box = document.getElementById('parts'); if (!box) return;
      box.innerHTML = '';
      const row = document.createElement('div'); row.className = 'part-row';
      for (const s of HORN_STYLES) {
        const prev = s.svg.replace(/url\(#gGold\)/g, '#F5C542');   // 预览里没有渐变定义,用纯金色
        const b = document.createElement('div'); b.className = 'part-opt' + (s.id === curHorn ? ' active' : '');
        b.title = s.name;
        b.innerHTML = '<svg viewBox="95 0 210 100">' + prev + '<g transform="translate(400,0) scale(-1,1)">' + prev + '</g></svg><span>' + s.name + '</span>';
        b.onclick = () => { applyHorns(s.id); toNative({ type: 'setPart', part: 'horns', style: s.id }); };
        row.appendChild(b);
      }
      box.appendChild(row);
    }

    const BASE_HUE = 4;   // 原始「赤金龙」#EE5044 的主色相,自定义颜色以此为基准做 hue-rotate
    function hexToHsl(hex) {
      const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
      if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
      const l = (mx + mn) / 2, s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
      return { h, s, l };
    }
    function filterForColor(hex) {
      const c = hexToHsl(hex);
      const dh = Math.round(c.h - BASE_HUE);
      const sat = Math.max(0.4, Math.min(1.7, c.s * 1.5)).toFixed(2);
      const bri = (0.85 + c.l * 0.4).toFixed(2);
      return `hue-rotate(${dh}deg) saturate(${sat}) brightness(${bri})`;
    }
    function applyTheme(v) {
      const w = $('dragon-wrap');
      if (typeof v === 'string' && v[0] === '#') {     // 自定义颜色
        curTheme = v;
        if (w) w.style.filter = filterForColor(v);
        const ci = $('c-color'); if (ci) ci.value = v;
      } else {                                          // 预设主题
        const th = THEMES.find(x => x.id === v) || THEMES[0]; curTheme = th.id;
        if (w) w.style.filter = th.filter === 'none' ? '' : th.filter;
      }
      renderThemes();
    }
    function renderThemes() {
      const box = $('themes'); if (!box) return; box.innerHTML = '';
      for (const th of THEMES) {
        const s = document.createElement('div'); s.className = 'sw' + (th.id === curTheme ? ' active' : '');
        s.style.background = th.swatch; s.title = th.name; s.innerHTML = '<span>' + th.name + '</span>';
        s.onclick = () => { applyTheme(th.id); toNative({ type: 'setTheme', theme: th.id }); };
        box.appendChild(s);
      }
      const ci = $('c-color'); if (ci) ci.classList.toggle('active', typeof curTheme === 'string' && curTheme[0] === '#');
    }

    /* ---------- 桥 ---------- */
    function toNative(m) { if (inNative) window.webkit.messageHandlers.pet.postMessage(m); }
    window.petReceive = (msg) => {
      switch (msg.type) {
        case 'reply':
          busy = false; sendbtn.disabled = false;
          if (D()) D().playGesture('happy');
          if (body.classList.contains('chat')) { removeTyping(); addMsg('pet', msg.text || '记好啦~'); }
          else showBubble(msg.text || '记好啦~', {});
          break;
        case 'error':
          busy = false; sendbtn.disabled = false;
          removeTyping();
          if (body.classList.contains('chat')) addMsg('pet', msg.text);
          else showBubble(msg.text, { actions: msg.needConfig ? [{ label: '去配置', primary: true, onClick: () => { enterChat(); openSettings(); } }] : null });
          break;
        case 'tasks': pendingTasks = msg.items || []; break;
        case 'attached': showChip(msg.kind || '文件', msg.name || ''); break;
        case 'attachError': clearChip(); if (body.classList.contains('chat')) addMsg('pet', msg.text || '这个文件我读不了'); else showBubble(msg.text || '这个文件我读不了', {}); break;
        case 'motion': if (!sleeping && D()) D().setMotion(msg.state, msg.dir); break;
        case 'config': config = msg; renderModels(); if (msg.theme) applyTheme(msg.theme); applyParts(msg.parts); if (msg.petName !== undefined) setPetName(msg.petName); { const st = $('still-toggle'); if (st) st.checked = !!msg.stayStill; } break;
        case 'hover':
          if (sleeping || body.classList.contains('chat')) break;
          if (msg.on) showBubble('嗯?是不是有什么事~ 点我说说 ✨', { ttl: 0 });
          else hideBubble();
          break;
        case 'matrxNew':
          if (D()) { D().poke && D().poke(); D().setMotion('jump', 1); }
          if (body.classList.contains('chat')) addMsg('pet', '📨 Matrx 有新消息!');
          else showBubble('📨 Matrx 有新消息!', { ttl: 15000, actions: [{ label: '打开 Matrx', primary: true, onClick: () => toNative({ type: 'openMatrx' }) }, { label: '知道了', onClick: () => {} }] });
          break;
        case 'attn':   // 外部提醒(如 Claude 在等你授权/已完成)
          if (D()) { D().poke && D().poke(); D().setMotion('jump', 1); }
          if (body.classList.contains('chat')) addMsg('pet', msg.text || '主人,Claude 在等你');
          else showBubble(msg.text || '主人,Claude 在等你', { ttl: 20000, actions: [{ label: '知道了', onClick: () => {} }] });
          break;
      }
    };

    /* ---------- 待机气泡 ---------- */
    function showBubble(text, opts = {}) {
      clearTimeout(bubbleTimer); bubble.innerHTML = '';
      const p = document.createElement('div'); p.className = 'md'; p.innerHTML = renderMD(text); bubble.appendChild(p);
      if (opts.actions) {
        const row = document.createElement('div'); row.className = 'actions';
        for (const a of opts.actions) { const b = document.createElement('button'); b.textContent = a.label; if (a.primary) b.className = 'primary';
          b.onclick = e => { e.stopPropagation(); hideBubble(); a.onClick && a.onClick(); }; row.appendChild(b); }
        bubble.appendChild(row);
      }
      bubble.classList.add('show'); if (D()) D().setTalking(true);
      // 量气泡实际高度,让待机窗口长高到刚好放得下(避免顶部被裁)
      requestAnimationFrame(() => toNative({ type: 'bubbleH', h: bubble.offsetHeight }));
      if (opts.ttl !== 0) bubbleTimer = setTimeout(hideBubble, opts.ttl || 8000);
    }
    function hideBubble() { bubble.classList.remove('show'); toNative({ type: 'bubbleH', h: 0 }); }

    /* ---------- 轻量 Markdown 渲染(先转义 HTML,再套标记,防注入) ---------- */
    function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function renderInline(s) {
      s = escapeHtml(s);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
      return s;
    }
    function renderMD(text) {
      const lines = String(text).replace(/\r\n/g, '\n').split('\n');
      let html = '', list = null, m;
      const close = () => { if (list) { html += '</' + list + '>'; list = null; } };
      for (const raw of lines) {
        const line = raw.replace(/\s+$/, '');
        if (!line.trim()) { close(); continue; }
        if ((m = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/))) { close(); html += '<div class="mdh">' + renderInline(m[2]) + '</div>'; }
        else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + renderInline(m[1]) + '</li>'; }
        else if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + renderInline(m[1]) + '</li>'; }
        else { close(); html += '<div>' + renderInline(line) + '</div>'; }
      }
      close();
      return html;
    }

    /* ---------- 消息 ---------- */
    function addMsg(who, text) {
      const d = document.createElement('div'); d.className = 'msg ' + who;
      if (who.indexOf('pet') === 0 && text) { d.classList.add('md'); d.innerHTML = renderMD(text); }
      else d.textContent = text;
      messages.appendChild(d); messages.scrollTop = messages.scrollHeight; return d;
    }
    let typingEl = null;
    function addTyping() { removeTyping(); typingEl = addMsg('pet typing', ''); }
    function removeTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

    /* ---------- 进/出对话 ---------- */
    function enterChat() {
      if (body.classList.contains('chat')) return;
      body.classList.add('chat'); toNative({ type: 'setMode', mode: 'chat' });
      if (!messages.childElementCount) addMsg('pet', '我在呢~说吧,我帮你记着、帮你办 ✨');
      setTimeout(() => input.focus(), 150);
    }
    function exitChat() {
      body.classList.remove('chat'); settings.classList.remove('show');
      toNative({ type: 'setMode', mode: 'idle' });
      if (D()) D().poke();
    }
    hit.addEventListener('click', () => {
      if (window.__dragSuppress && performance.now() - window.__dragSuppress < 350) return; // 刚拖动过,不开聊天
      if (sleeping) { wake(); return; }
      if (D()) D().poke(); enterChat();
    });
    $('btn-close').onclick = exitChat;

    /* ---------- 发送 ---------- */
    /* ---------- 附件(📎 选择 / 拖入) ---------- */
    let attachName = null;
    const attachchip = $('attachchip');
    function showChip(kind, name) {
      attachName = name;
      attachchip.innerHTML = '';
      const label = document.createElement('span'); label.textContent = '📎 ' + kind + ':' + name;
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
      x.onclick = () => { attachName = null; attachchip.classList.remove('show'); toNative({ type: 'clearAttach' }); };
      attachchip.append(label, x); attachchip.classList.add('show');
    }
    function clearChip() { attachName = null; attachchip.classList.remove('show'); }
    $('attachbtn').onclick = () => { if (!busy) toNative({ type: 'pickFile' }); };

    // 聊天时 Cmd+V 粘贴剪贴板里的图片(macOS 截图到剪贴板后直接贴)
    document.addEventListener('paste', e => {
      if (!body.classList.contains('chat')) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type && it.type.indexOf('image') === 0) {
          const file = it.getAsFile(); if (!file) continue;
          const r = new FileReader();
          r.onload = () => toNative({ type: 'pasteImage', dataURL: r.result, name: '剪贴板截图.' + (it.type.split('/')[1] || 'png') });
          r.readAsDataURL(file);
          e.preventDefault();
          return;
        }
      }
    });

    function sendChat() {
      const text = input.value.trim(); if ((!text && !attachName) || busy) return;
      input.value = ''; busy = true; sendbtn.disabled = true;
      addMsg('me', text + (attachName ? '  📎' + attachName : '')); addTyping(); if (D()) D().poke();
      clearChip();
      if (inNative) toNative({ type: 'chat', text });
      else setTimeout(() => window.petReceive({ type: 'reply', text: '(预览)记下啦:' + text }), 900);
    }
    sendbtn.onclick = sendChat;
    // 回车发送,但输入法(拼音等)正在组字时不发送 —— isComposing / keyCode 229 都挡一道
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) sendChat();
    });

    /* ---------- 睡觉 / 退出 ---------- */
    function sleep() { sleeping = true; if (D()) D().setSleep(true); }
    function wake() { sleeping = false; if (D()) { D().setSleep(false); D().poke(); } }
    $('btn-sleep').onclick = () => { sleeping ? wake() : sleep(); $('btn-sleep').textContent = sleeping ? '☀️' : '🌙'; };
    $('btn-quit').onclick = () => toNative({ type: 'quit' });

    /* ---------- 设置 ---------- */
    function openSettings() { settings.classList.add('show'); renderThemes(); renderParts(); renderModels(); }
    $('btn-settings').onclick = () => settings.classList.contains('show') ? settings.classList.remove('show') : openSettings();
    $('c-color').oninput = () => { applyTheme($('c-color').value); toNative({ type: 'setTheme', theme: $('c-color').value }); };
    $('petname-input').onchange = () => { const n = $('petname-input').value.trim(); setPetName(n); toNative({ type: 'setPetName', name: n }); };
    $('still-toggle').onchange = () => toNative({ type: 'setStill', on: $('still-toggle').checked });
    $('m-back').onclick = () => settings.classList.remove('show');
    function renderModels() {
      const list = $('model-list'); if (!list) return; list.innerHTML = '';
      if (!config.models.length) { list.innerHTML = '<div class="hint">还没有配置模型</div>'; return; }
      for (const m of config.models) {
        const div = document.createElement('div'); div.className = 'model-item' + (m.name === config.active ? ' active' : '');
        const radio = document.createElement('span'); radio.textContent = m.name === config.active ? '🟠' : '⚪️'; radio.style.cursor = 'pointer';
        radio.onclick = () => toNative({ type: 'selectModel', name: m.name });
        const name = document.createElement('span'); name.className = 'name'; name.textContent = `${m.name}(${m.model})`;
        const edit = document.createElement('button'); edit.textContent = '✏️';
        edit.onclick = () => { $('m-name').value = m.name; $('m-format').value = m.format || 'openai'; $('m-model').value = m.model; $('m-url').value = m.baseURL; $('m-key').value = ''; $('m-key').placeholder = 'API Key(留空=不改)'; };
        const del = document.createElement('button'); del.textContent = '🗑'; del.onclick = () => toNative({ type: 'deleteModel', name: m.name });
        div.append(radio, name, edit, del); list.appendChild(div);
      }
    }
    $('m-save').onclick = () => {
      const m = { name: $('m-name').value.trim(), format: $('m-format').value, model: $('m-model').value.trim(), baseURL: $('m-url').value.trim(), apiKey: $('m-key').value.trim() };
      if (!m.name || !m.baseURL || !m.model) { addMsg('pet', '名称、地址、模型ID 都要填哦'); return; }
      if (inNative) toNative({ type: 'saveModel', model: m });
      else { config.models = config.models.filter(x => x.name !== m.name).concat(m); config.active = m.name; renderModels(); }
      addMsg('pet', `模型「${m.name}」已保存并启用 ✅`); $('m-key').value = '';
    };

    /* ---------- 偶尔弹小问题(仅待机) ---------- */
    const SQ = ['喝水了嘛?起来动一动 💧', '有什么要记的吗?', '刚闪过的想法要记下来吗?', '现在最挂心啥呀?', '上午的事顺利吗?'];
    function popQuestion() {
      if (sleeping || busy || body.classList.contains('chat')) return;
      let q, act = '聊聊';
      if (pendingTasks.length && Math.random() < .4) q = '「' + pendingTasks[Math.floor(Math.random() * pendingTasks.length)].slice(0, 30) + '」今天要动一动吗?';
      else q = SQ[Math.floor(Math.random() * SQ.length)];
      if (D()) D().poke();
      showBubble(q, { ttl: 20000, actions: [{ label: act, primary: true, onClick: enterChat }, { label: '晚点', onClick: () => {} }] });
    }
    (function loop() { setTimeout(() => { popQuestion(); loop(); }, DEMO ? 15000 : (35 + Math.random() * 35) * 60000); })();

    if (!inNative && DEMO) {
      const states = [['walk', 1], ['idle', 1], ['run', -1], ['jump', -1], ['walk', -1], ['idle', -1]]; let i = 0;
      setTimeout(() => setInterval(() => { if (!body.classList.contains('chat') && D()) D().setMotion(...states[i++ % states.length]); }, 2800), 900);
    }
    setTimeout(() => { renderThemes(); toNative({ type: 'ready' }); }, 700);
    window.__pet = { state: () => ({ sleeping, busy, chat: body.classList.contains('chat'), dragon: !!D() }) };
  })();
  </script>
</body>
