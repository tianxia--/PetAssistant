<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小龙候选对比</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; background: #f0ede6; }
  .row { display: flex; justify-content: center; gap: 24px; padding: 24px; }
  .card { background: #fff; border-radius: 18px; padding: 16px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .card.dark { background: #2b2d33; color: #eee; }
  .card img { width: 260px; height: 260px; display: block; }
  .card h3 { margin: 8px 0 0; font-size: 15px; }
</style>
</head>
<body>
  <div class="row">
    <div class="card"><img src="candidates/chunky.svg"><h3>A 蓝绿墩墩龙</h3></div>
    <div class="card"><img src="candidates/festive.svg"><h3>B 红金福龙</h3></div>
    <div class="card"><img src="candidates/pastel.svg"><h3>C 薄荷奶油</h3></div>
  </div>
  <div class="row">
    <div class="card dark"><img src="candidates/chunky.svg"><h3>A 深色背景</h3></div>
    <div class="card dark"><img src="candidates/festive.svg"><h3>B 深色背景</h3></div>
    <div class="card dark"><img src="candidates/pastel.svg"><h3>C 深色背景</h3></div>
  </div>
</body>
</html>
